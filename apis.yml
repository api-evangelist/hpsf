x-pointers-deliberately-omitted:
  note: >-
    Recorded so a later pass does not read these as gaps this run missed. Each was probed, searched or
    derived and the underlying thing is genuinely absent, so emitting the pointer would be a false
    claim made on HPSF's behalf.
  omitted:
  - type: SecurityTxt
    reason: >-
      /.well-known/security.txt returns HTTP 404 on both hpsf.io and www.hpsf.io. The probe is recorded
      in well-known/hpsf-well-known.yml; the pointer is not.
  - type: AgentCard
    reason: >-
      /.well-known/agent-card.json and /.well-known/agent.json both return HTTP 404 on both hosts.
      Never derived. No a2a/ artifact was written.
  - type: MCPServer
    reason: >-
      No MCP server exists - not from HPSF and not from the plugin vendor. mcp/hpsf-mcp.yml carries
      deployment.mode none and a candidate tool list, so it is pointed at with X-MCPServerCandidate.
  - type: ToolCrosswalk
    reason: >-
      Nothing to cross-walk. A crosswalk binds MCP tools or GraphQL fields to REST operations; HPSF has
      neither an MCP server nor a GraphQL endpoint (POST https://hpsf.io/graphql returns 404 HTML).
  - type: SDKs
    reason: >-
      npm, PyPI, RubyGems and crates.io searches returned zero first-party packages, and none of the 6
      repositories in github.com/hpsfoundation is a package. packages/hpsf-packages.yml records
      package_count 0.
  - type: Idempotency
    reason: >-
      conventions idempotency.coverage is `na`, not `full` or `partial`. Every anonymously reachable
      operation is a GET; no Idempotency-Key header is accepted, documented or observed.
  - type: StatusPage
    reason: >-
      No status page. The `status` link inside HPSF's own api-catalog linkset points at
      https://hpsf.io - the homepage - which reports nothing about availability.
  - type: Deprecation
    reason: >-
      No deprecation policy for the API, and no Sunset or Deprecation header on any observed response.
      The published lifecycle_policy.md governs PROJECT stages, not API versions, and is recorded in
      lifecycle/hpsf-lifecycle.yml under project_lifecycle rather than claimed as an API policy.
  - type: Security
    reason: >-
      0-working/probe-security-programs.py returned vdp=none trust=none. No vulnerability-disclosure
      policy, no bug bounty, no security contact.
  - type: Compliance
    reason: No certification, audit report or trust center is published.
  - type: AsyncAPI
    reason: >-
      /asyncapi.yaml and /asyncapi.json both 404, and none of the 99 routes is an event stream.
      asyncapi/hpsf-event-surface.yml records the absence.
  - type: Webhooks
    reason: >-
      There is no webhook surface. The tribe/zapier/v1 and tribe/power-automate/v1 namespaces are
      credential-gated POLLING triggers - the consumer asks what changed; nothing on this host calls
      back. Emitting Webhooks would invert the direction the pointer exists to record.
  - type: ChangeLog
    reason: >-
      No dated changelog for the API or the site. The blog is foundation news and is wired as
      Blog/BlogRSS.
  - types: [DeveloperPortal, GettingStarted, Sandbox, CLI, Postman, Roadmap, OAuthScopes, Protobuf, WSDL,
      Components, DeclineCodes, TrustCenter, Vocabulary, Rules]
    reason: >-
      None of these exists. HPSF runs no developer program: no portal, no quickstart, no console or
      sandbox, no CLI, no public Postman collection, no published roadmap. There is no oauth2
      securityScheme anywhere (so no scopes to derive), no gRPC and no SOAP - `?wsdl` on both hosts
      returns the WordPress JSON root or the HTML homepage, never a WSDL. No embeddable components,
      no payment surface, no trust center, no vocabulary and no Spectral ruleset.
