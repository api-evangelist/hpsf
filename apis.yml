  name: HPSF Events API
  description: >-
    The stable Events Calendar v1 REST API on hpsf.io, serving HPSF's conference and event calendar as
    JSON - HPSFcon, SC and CppCon listings with start and end dates, timezone details, cost, website,
    featured image, venue, organizer, categories and tags. Read access is anonymous and keyless; 30 operations
    are declared across events, venues, organizers, categories and tags, with the write half requiring
    WordPress Application Passwords. The contract is published live by the host at /wp-json/tribe/events/v1/doc.
