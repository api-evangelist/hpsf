aid: hpsf
name: High Performance Software Foundation
description: >-
  The High Performance Software Foundation (HPSF) is a Linux Foundation project and neutral hub for
  open source high performance computing software, founded in 2024 and governed by a Governing Board,
  a Technical Advisory Council (TAC) and an Outreach Committee. HPSF hosts and supports a portable
  core software stack for HPC - including Spack, Kokkos, Apptainer, E4S, HPX, Charliecloud, Chapel,
  Viskores, Flux Framework and Wi4MPI - across Core, Established and Emerging project stages, and runs
  HPSFcon alongside a presence at SC and CppCon. Organizations join at Premier, General or Associate
  tier; projects apply to the TAC. HPSF publishes no developer program and ships no SDKs, but hpsf.io
  is a machine-readable surface in its own right: it serves an RFC 9727 /.well-known/api-catalog
  linkset, an llms.txt, a Content-Signal AI usage preference in robots.txt, and two live OpenAPI
  documents describing a publicly callable events API covering HPSF conferences, venues, organizers
  and event taxonomies. The WordPress wp/v2 content routes are advertised in the namespace list but
  are disabled on this installation.
type: Index
