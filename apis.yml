  description: >-
    The WordPress REST route index at https://hpsf.io/wp-json/ - the anchor the site's RFC 9727 /.well-known/api-catalog
    linkset points at. It returns the site identity, the 15 registered namespaces, 99 route definitions
    with their methods and argument schemas, and the Application Passwords authorization endpoint. It
    is the authoritative machine-readable inventory of what this host exposes, and it is also where the
    absence shows: wp/v2 is listed as a namespace but every wp/v2 route returns rest_no_route 404, and
    wp-abilities/v1 returns 401.
