description: >-
  HPSF publishes no API plans and no API pricing, because it sells no API. The events surface on
  hpsf.io is free, anonymous and keyless, with no sign-up, no key issuance and no metering. What HPSF
  does sell is organizational membership in a Linux Foundation project, at three named tiers - Premier,
  General and Associate - and the dues for those tiers are not published on the site either; the join
  path is an LFX enrollment form. Recorded as plan_count 0 rather than as three plans, because
  membership tiers buy governance seats and marketing visibility, not API access, and conflating them
  would misrepresent both.
