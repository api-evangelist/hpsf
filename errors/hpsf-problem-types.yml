- status: 404
  meaning: The event, venue, organizer, category, tag or page does not exist.
  sources: [openapi/hpsf-events-api-openapi.yml, openapi/hpsf-tec-events-api-openapi.yml]
- status: 410
  meaning: >-
    The resource has already been trashed. Notable - this surface uses 410 Gone to distinguish
    "already deleted" from "never existed", which most WordPress surfaces collapse into 404.
  sources: [openapi/hpsf-events-api-openapi.yml, openapi/hpsf-tec-events-api-openapi.yml]
- status: 500
  meaning: The delete or update failed server-side.
  sources: [openapi/hpsf-events-api-openapi.yml, openapi/hpsf-tec-events-api-openapi.yml]
- status: 501
  meaning: >-
    The post type does not support trashing; the caller must re-issue with force=true to delete
    permanently. Declared only by the tec/v1 contract.
  sources: [openapi/hpsf-tec-events-api-openapi.yml]
notes:
- >-
  The two contracts published by this host disagree on one point of substance - tec/v1 declares 401
  for an unauthenticated call and tribe/events/v1 does not declare 401 at all, going straight to 403.
  Recorded rather than reconciled, because both documents are the provider's own.
- >-
  No error is documented on any hpsf.io page. Everything here is read off the wire or out of the two
  contracts the host serves; HPSF publishes no developer documentation.
