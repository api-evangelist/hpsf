edge_backpressure:
  cdn: Fastly (Varnish) fronting Pantheon
  cache_control: 'public, max-age=604800'
  note: >-
    The only real throttling signal on this surface is the cache. A seven-day public max-age means most
    repeat calls are answered from an edge node rather than the origin, which protects HPSF but also
    means an agent can be served a week-old event list without any indication that it is stale. There
    is no ETag and no Last-Modified, so a caller cannot revalidate cheaply.
paging_limits:
  per_page_max: 100
  per_page_default: 10
  enforcement: >-
    Declared as maximum 100 in both contracts. Observed to be clamped rather than rejected - a request
    for per_page=9999 returned HTTP 200 with a bounded page, not a 400.
  note: >-
    This is the only enforced numeric ceiling found anywhere on the surface. It bounds a single
    response, not a request rate, and is recorded here so it is not mistaken for one.
