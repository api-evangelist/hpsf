limits: []
description: >-
  HPSF documents no rate limits and returns no rate-limit headers. There is no developer portal, no API
  terms of use and no fair-use page anywhere on hpsf.io - the only terms linked from the site are the
  Linux Foundation's general terms, which say nothing about API calls. Whatever throttling exists is
  imposed by the Fastly/Pantheon hosting layer and is invisible to a caller, so an agent calling this
  host has no runtime signal to back off on and must self-pace.
